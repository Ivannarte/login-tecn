<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header-logo">
        <h2>TECNOLÓGICO NACIONAL DE MÉXICO</h2>
    </div>

    <div class="login-container">
        <h2>Iniciar sesión</h2>

        <!-- Mensaje de error dinámico si viene por GET -->
        <div id="error-alert"></div>

        <form action="login.php" method="POST">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Usuario" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </div>

            <label class="show-pass">
                <input type="checkbox" id="ver-password" onclick="togglePassword()"> Mostrar contraseña
            </label>

            <div class="form-group">
                <label for="cargo">Seleccione:</label>
                <select id="cargo" name="cargo" required>
                    <option value="" disabled selected>Seleccione:</option>
                    <option value="alumno">Alumno</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Ingresar</button>
                <button type="reset" class="btn btn-cancel">Cancelar</button>
            </div>
        </form>
    </div>

    <script>
        // Script para mostrar/ocultar contraseña
        function togglePassword() {
            const passInput = document.getElementById('password');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        // Mostrar errores si la URL contiene ?error=datos
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('error')) {
            document.getElementById('error-alert').innerHTML = `<div class="error-message">Usuario, contraseña o rol incorrectos.</div>`;
        }
    </script>
</body>
</html>
